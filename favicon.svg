  <circle cx="32" cy="20" r="7" fill="#0d2a6e" opacity="0.4"/>
  <circle cx="32" cy="20" r="5" fill="#1a5fff" opacity="0.55"/>
  <circle cx="32" cy="20" r="3" fill="#5aadff"/>
  <circle cx="32" cy="20" r="1.5" fill="#d8f0ff"/>

  <!-- искры -->
  <line x1="32" y1="20" x2="44" y2="9"  stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="32" y1="20" x2="20" y2="8"  stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <line x1="32" y1="20" x2="47" y2="21" stroke="#7ec8ff" stroke-width="1"   stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="20" x2="17" y2="22" stroke="#7ec8ff" stroke-width="1"   stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="20" x2="39" y2="28" stroke="#4a9eff" stroke-width="1"   stroke-linecap="round" opacity="0.55"/>
  <circle cx="44.5" cy="8.5"  r="2" fill="#7ec8ff"/>
  <circle cx="19.5" cy="7.5"  r="2" fill="#7ec8ff"/>
  <circle cx="48"   cy="21.5" r="1.5" fill="#4a9eff"/>

