  <!-- труба левая -->
  <rect x="0" y="23" width="27" height="18" fill="#0c1e40"/>
  <rect x="0" y="23" width="27" height="4" fill="#162f5e"/>
  <rect x="0" y="37" width="27" height="4" fill="#08152e"/>
  <ellipse cx="0" cy="32" rx="4" ry="9" fill="#0e2448"/>
  <ellipse cx="0" cy="32" rx="4" ry="9" fill="none" stroke="#1c3d72" stroke-width="1.5"/>

  <!-- труба правая -->
  <rect x="37" y="23" width="27" height="18" fill="#0c1e40"/>
  <rect x="37" y="23" width="27" height="4" fill="#162f5e"/>
