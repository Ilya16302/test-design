  <rect x="3" y="45" width="58" height="16" rx="4" fill="#0a1830"/>
  <!-- столбики -->
  <rect x="7"  y="52" width="5" height="7"  rx="1.5" fill="#1e4a8a" opacity="0.8"/>
  <rect x="14" y="49" width="5" height="10" rx="1.5" fill="#2462c8"/>
  <rect x="21" y="50" width="5" height="9"  rx="1.5" fill="#1e4a8a" opacity="0.8"/>
  <rect x="28" y="47" width="5" height="12" rx="1.5" fill="#3d8fff"/>
  <rect x="35" y="49" width="5" height="10" rx="1.5" fill="#2462c8"/>
  <rect x="42" y="48" width="5" height="11" rx="1.5" fill="#3d8fff" opacity="0.9"/>
  <rect x="49" y="46" width="5" height="13" rx="1.5" fill="#5ab4ff"/>
  <!-- линия тренда -->
  <polyline points="9,55 16,51 23,53 30,49 37,51 44,50 51,47"
    fill="none" stroke="#7ec8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="51" cy="47" r="2.5" fill="#7ec8ff"/>

